[project]
name = "paprika-recipe-api"
version = "0.1.0"
description = "Modular harness for processing exported Paprika recipes (Markdown + YAML frontmatter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.48.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paprika_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
